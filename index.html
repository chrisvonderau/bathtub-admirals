<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bathtub Admirals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#BFE9E4">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bathtub Admirals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen game stage on a bathroom-tile wall; each board is water inside a claw-foot enamel tub.
   Deliberately single-look (bright cartoon bathroom), so every color is set explicitly for both host themes. */
:root{
  --tile:#BFE9E4; --grout:#A3DAD3; --ink:#16324F; --enamel:#FFFDF8; --enamel-shade:#E8E0D0;
  --water:#4DB8EE; --water-deep:#1F6FB2; --duck:#FFC93C; --coral:#FF5A5F; --cobalt:#2E8FD8;
  --mint:#1F9D5F; --muted:#4B6A86; --gold:#C9A227;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --cell-base:clamp(20px, min(7.6vw, 5.3vh), 50px);
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:64px 64px; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.35;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px 28px}
h1,h2,h3{margin:0; text-wrap:balance}
body{-webkit-tap-highlight-color:transparent}
.water,.btn,.dock-item,.chip{touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
button{font:inherit}

/* background bubbles */
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.bubble{position:absolute; bottom:-60px; border-radius:50%; border:2px solid rgba(255,255,255,.75);
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9) 0 12%, rgba(255,255,255,.15) 30%, rgba(255,255,255,.05) 70%);
  animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--sway,20px), -115vh)}}

/* top bar */
.top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between; padding-block:4px 10px}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--display); font-size:22px; color:var(--ink)}
.brand svg{width:44px; height:22px}
.chips{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.chip{display:flex; gap:8px; align-items:center; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:2px 12px; font-weight:700; transition:background .2s}
.chip.on{background:var(--duck)}
.chip .wins{font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.chip.on .wins{color:var(--ink)}
.dot{width:12px; height:12px; border-radius:50%; border:2px solid var(--ink)}
.p0 .dot{background:var(--coral)} .p1 .dot{background:var(--cobalt)}
.vs{font-family:var(--display); color:var(--muted)}
.tools{display:flex; gap:8px}

/* buttons */
.btn{font-family:var(--body); font-weight:800; font-size:16px; padding:8px 18px; border-radius:14px; border:3px solid var(--ink);
  background:#fff; color:var(--ink); box-shadow:0 4px 0 var(--ink); cursor:pointer; transition:transform .08s, box-shadow .08s, background .15s; line-height:1.2}
.btn:hover{background:#FFF6DA}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--duck)}
.btn.primary:hover{background:#FFD45F}
.btn.big{font-size:19px; padding:12px 24px}
.btn.sm{font-size:14px; padding:4px 12px; box-shadow:0 3px 0 var(--ink); border-width:2px}
.btn.icon{display:grid; place-items:center; width:40px; height:36px; padding:0}
.btn.icon svg{width:22px; height:22px}
.btn:disabled{opacity:.55; cursor:not-allowed; transform:none; box-shadow:0 4px 0 var(--ink); background:#fff}
.btn:focus-visible,.dock-item:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--coral); outline-offset:3px}

.screen{flex:1; display:flex; flex-direction:column; align-items:center; gap:16px; padding-top:6px}
.heading{text-align:center; display:grid; gap:2px}
.heading h2{font-family:var(--display); font-weight:400; font-size:clamp(24px, 3vw, 36px); color:var(--ink)}
.heading p{margin:0; color:var(--muted); font-weight:600; max-width:62ch}
kbd{font-family:var(--body); font-weight:800; background:#fff; border:2px solid var(--ink); border-bottom-width:4px; border-radius:6px; padding:0 6px}
.card,.panel{background:var(--enamel); border:3px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink)}

/* ---------- title ---------- */
.title-screen{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:28px 44px; align-items:center; max-width:1100px; width:100%; margin:auto; padding-top:10px}
.hero{min-width:0}
.hero h1{font-family:var(--display); font-weight:400; font-size:clamp(52px, 8.5vw, 112px); line-height:.9; color:var(--duck);
  -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:0 7px 0 var(--ink); letter-spacing:.5px}
.hero .tag{font-size:20px; font-weight:600; max-width:34ch; margin:18px 0 0}
.logo-duck{width:min(260px,60%); position:relative; margin-bottom:10px}
.logo-duck svg{width:100%; height:auto; animation:bob 2.6s ease-in-out infinite; transform-origin:50% 90%}
.logo-duck::after{content:""; position:absolute; left:8%; right:4%; bottom:-6px; height:16px; border-radius:50%; background:rgba(31,111,178,.35); filter:blur(1px)}
.setup{padding:24px; display:grid; gap:14px}
.field{display:grid; gap:4px}
.field label{font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.field input{font:inherit; font-size:20px; font-weight:700; padding:8px 12px; border:3px solid var(--ink); border-radius:12px; background:#fff; color:var(--ink); min-width:0}
.field:nth-child(1) input{border-left:12px solid var(--coral)}
.field:nth-child(2) input{border-left:12px solid var(--cobalt)}
.check{display:flex; gap:10px; align-items:center; font-weight:700; cursor:pointer}
.check input{width:22px; height:22px; accent-color:var(--coral)}
.how{margin:4px 0 0; padding-left:22px; color:var(--muted); font-weight:600; display:grid; gap:2px; font-size:15px}
.roster{grid-column:1/-1; display:flex; flex-wrap:wrap; justify-content:center; gap:12px 22px; background:rgba(255,255,255,.55); border-radius:20px; padding:14px 18px; border:2px dashed rgba(22,50,79,.35)}
.roster-item{display:flex; align-items:center; gap:10px}
.roster-item b{display:block; line-height:1.1}
.roster-item span{font-size:14px; color:var(--muted); font-weight:600}
.mini svg{display:block; height:30px; width:calc(30px * var(--len))}
.mini.xs svg{height:18px; width:calc(18px * var(--len))}

/* ---------- boards ---------- */
.arena{display:flex; gap:26px; justify-content:center; align-items:flex-start; flex-wrap:wrap; width:100%}
.board-col{display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0}
.board-label{font-family:var(--display); font-size:20px; color:var(--ink); text-align:center}
.tub{--cell:var(--cell-base); position:relative; width:fit-content; background:var(--enamel);
  padding:calc(var(--cell)*.25) calc(var(--cell)*.4) calc(var(--cell)*.4) calc(var(--cell)*.22);
  border-radius:calc(var(--cell)*.7); border:3px solid var(--ink);
  box-shadow:inset 0 -8px 0 var(--enamel-shade), 0 6px 0 var(--ink); margin-bottom:12px}
.tub::before,.tub::after{content:""; position:absolute; bottom:-14px; width:26px; height:16px; background:var(--gold); border:3px solid var(--ink); border-top:0; border-radius:0 0 14px 14px}
.tub::before{left:16%} .tub::after{right:16%}
.tub.small{--cell:calc(var(--cell-base)*.56); border-width:2px; margin-bottom:8px}
.tub.small::before,.tub.small::after{width:16px; height:10px; bottom:-10px; border-width:2px}
.board{display:grid; grid-template-columns:calc(var(--cell)*.6) repeat(10,var(--cell)); grid-template-rows:calc(var(--cell)*.6) repeat(10,var(--cell))}
.lab{display:grid; place-items:center; font-family:var(--display); font-size:calc(var(--cell)*.36); color:var(--muted); font-variant-numeric:tabular-nums}
.water{grid-column:2/12; grid-row:2/12; position:relative; display:grid; grid-template-columns:repeat(10,var(--cell)); grid-template-rows:repeat(10,var(--cell));
  background:linear-gradient(160deg,#6ACDF5,var(--water) 40%,var(--water-deep)); border-radius:calc(var(--cell)*.3);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.4), inset 0 calc(var(--cell)*.3) calc(var(--cell)*.5) rgba(255,255,255,.18)}
.caustics{position:absolute; inset:0; border-radius:inherit; overflow:hidden; pointer-events:none}
.caustics::before{content:""; position:absolute; inset:-60px; animation:drift 14s linear infinite;
  background:radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255,255,255,.2) 0 35%, transparent 60%) 0 0/70px 40px,
             radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255,255,255,.12) 0 35%, transparent 60%) 35px 20px/70px 40px}
@keyframes drift{to{transform:translate(70px,40px)}}
.cell{position:relative; z-index:2; box-shadow:inset 0 0 0 .5px rgba(255,255,255,.32)}
.mode-target .cell.tgt{cursor:crosshair}
.mode-target .cell.tgt:hover,.mode-target .cell.tgt:focus-visible{background:rgba(255,255,255,.16)}
.mode-target .cell.tgt:hover::before,.mode-target .cell.tgt:focus-visible::before{content:""; position:absolute; inset:10%; border-radius:50%;
  border:3px solid var(--duck); box-shadow:0 0 0 2px var(--ink), inset 0 0 0 2px var(--ink);
  background:linear-gradient(var(--ink),var(--ink)) center/2px 60% no-repeat, linear-gradient(var(--ink),var(--ink)) center/60% 2px no-repeat}
.mode-place .water{cursor:pointer}

/* ships */
.ship{position:absolute; z-index:1; pointer-events:none}
.ship svg{position:absolute; left:0; top:0; width:calc(var(--cell)*var(--len)); height:var(--cell); overflow:visible; filter:drop-shadow(0 3px 0 rgba(22,50,79,.25))}
.ship.v svg{transform-origin:0 0; transform:rotate(90deg) translateY(-100%)}
.ship:not(.ghost):not(.sunk){animation:bob 3.2s ease-in-out infinite}
.ship:nth-of-type(2n){animation-delay:-1.1s} .ship:nth-of-type(3n){animation-delay:-2.3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-2px) rotate(-.8deg)}}
.ship.sunk{opacity:.92; transform:rotate(2deg)}
.ship.sunk svg{filter:grayscale(.95) brightness(.72) contrast(.95)}
.ship.ghost{z-index:3; border-radius:calc(var(--cell)*.25); transition:left .06s, top .06s}
.ship.ghost.ok{background:rgba(255,255,255,.28); box-shadow:0 0 0 3px #fff}
.ship.ghost.bad{background:rgba(255,90,95,.45); box-shadow:0 0 0 3px var(--coral)}
.ship.ghost svg{opacity:.85}
.ship.ghost.bad svg{opacity:.5}
.ship.ghost.nope{animation:nope .3s}
@keyframes nope{25%{translate:-5px 0} 75%{translate:5px 0}}

/* shot markers */
.mk{position:absolute; pointer-events:none}
.mk.miss{inset:32%; border-radius:50%; border:3px solid rgba(255,255,255,.9); background:rgba(255,255,255,.22)}
.mk.miss::after{content:""; position:absolute; inset:-55%; border-radius:50%; border:2px solid rgba(255,255,255,.35)}
.mk.hit{inset:17%; border-radius:50% 50% 46% 46%/60% 60% 40% 40%; border:2px solid var(--ink);
  background:radial-gradient(circle at 50% 68%, #FFF6C2 0 16%, var(--duck) 30%, var(--coral) 62%, #B81F2A 100%);
  box-shadow:0 0 12px rgba(255,90,95,.85); animation:flicker .45s ease-in-out infinite alternate; transform-origin:50% 100%}
.mk.hit::after{content:""; position:absolute; width:46%; height:46%; left:27%; top:-30%; border-radius:50%; background:rgba(70,80,95,.55); animation:smoke 1.6s ease-out infinite}
@keyframes flicker{to{transform:scale(1.08,.94) rotate(3deg)}}
@keyframes smoke{0%{transform:translateY(0) scale(.6); opacity:.8} 100%{transform:translateY(-120%) scale(1.5); opacity:0}}

/* firing effects */
.fx{position:absolute; z-index:6; width:0; height:0; pointer-events:none}
.fx b{position:absolute; left:0; bottom:calc(var(--cell)*.35); transform:translateX(-50%) rotate(-8deg); white-space:nowrap;
  font-family:var(--display); font-weight:400; font-size:calc(var(--cell)*.7); color:#fff; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill;
  text-shadow:0 4px 0 var(--ink); animation:pop 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.fx-hit b{color:var(--duck); font-size:calc(var(--cell)*.82)}
@keyframes pop{0%{transform:translateX(-50%) rotate(-8deg) scale(.2); opacity:0} 15%{opacity:1; transform:translateX(-50%) rotate(-8deg) scale(1.15)} 30%{transform:translateX(-50%) rotate(-6deg) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translateX(-50%) translateY(-24px) rotate(-6deg) scale(1)}}
.ring{position:absolute; width:var(--cell); height:var(--cell); left:calc(var(--cell)*-.5); top:calc(var(--cell)*-.5); border:3px solid #fff; border-radius:50%; animation:ring .8s ease-out forwards}
.ring.two{animation-delay:.15s; opacity:0}
@keyframes ring{0%{transform:scale(.2); opacity:1} 100%{transform:scale(2); opacity:0}}
.drop{position:absolute; width:9px; height:9px; left:-4px; top:-4px; border-radius:50% 50% 50% 0; background:#fff; border:1.5px solid var(--ink);
  transform:rotate(var(--a)) translateY(0); animation:drop .75s ease-out forwards}
@keyframes drop{to{transform:rotate(var(--a)) translateY(calc(var(--cell)*-1.2)); opacity:0}}
.burst{position:absolute; width:calc(var(--cell)*2.4); height:calc(var(--cell)*2.4); left:calc(var(--cell)*-1.2); top:calc(var(--cell)*-1.2); animation:burst .7s ease-out forwards}
@keyframes burst{0%{transform:scale(.1) rotate(0); opacity:1} 60%{opacity:1} 100%{transform:scale(1.25) rotate(25deg); opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-7px 3px} 40%{translate:6px -4px} 60%{translate:-4px 2px} 80%{translate:3px -1px}}

/* placement dock */
.dock{padding:18px; width:min(100%,360px); display:grid; gap:14px}
.dock h3,.tracker h3{font-family:var(--display); font-weight:400; font-size:20px}
.dock-list{display:grid; gap:8px}
.dock-item{display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto; column-gap:12px; align-items:center; text-align:left;
  border:3px solid var(--ink); border-radius:14px; background:#fff; padding:8px 12px; cursor:pointer; color:var(--ink); transition:background .15s, transform .1s}
.dock-item:hover{background:#FFF6DA}
.dock-item .mini{grid-row:1/3; width:80px; display:flex; justify-content:center}
.dock-item .mini svg{height:22px; width:calc(16px * var(--len)); max-width:80px}
.dock-item b{font-size:16px}
.dock-item .st{font-size:13px; font-weight:700; color:var(--muted)}
.dock-item.placed .st{color:var(--mint)}
.dock-item.placed{background:#EFFAF4}
.dock-item.sel{background:var(--duck); transform:translateX(4px)}
.dock-item.sel .st{color:var(--ink)}
.pips{display:inline-flex; gap:3px; margin-left:8px; vertical-align:middle}
.pips i{width:8px; height:8px; border-radius:50%; background:var(--ink); display:block}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row.center{justify-content:center}
.hint{margin:0; font-size:14px; color:var(--muted); font-weight:600}

/* battle */
.side{padding:16px; display:grid; gap:14px; justify-items:center; width:min(100%, calc(var(--cell-base)*.56*11.3 + 80px))}
.tracker{width:100%; display:grid; gap:6px}
.tracker ul{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.tracker li{display:grid; grid-template-columns:96px minmax(0,1fr) auto; gap:8px; align-items:center; font-weight:700; font-size:15px}
.tracker li .mini{display:flex; justify-content:flex-start}
.tracker li em{font-style:normal; font-size:13px; padding:0 8px; border-radius:999px; background:#E6F4FB; color:var(--water-deep); border:2px solid currentColor}
.tracker li.hurt em{background:#FFF1D6; color:#9A5B00}
.tracker li.sunk span{text-decoration:line-through; color:var(--muted)}
.tracker li.sunk em{background:#FFE3E4; color:#B81F2A}
.tracker li.sunk .mini svg{filter:grayscale(1) opacity(.6)}
.result{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; width:100%; max-width:640px}
.quip{flex:1 1 280px; min-width:0; display:grid; gap:0; background:var(--enamel); border:3px solid var(--ink); border-radius:18px; padding:10px 16px; box-shadow:0 5px 0 var(--ink)}
.quip b{font-family:var(--display); font-weight:400; font-size:24px; line-height:1.1}
.quip span{font-weight:600; color:var(--muted)}
.quip.miss b{color:var(--water-deep)} .quip.hit b{color:#D63A40} .quip.sunk b{color:#B81F2A}
.quip.sunk{background:#FFF1D6}
.quip.fresh{animation:quipIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes quipIn{from{transform:scale(.9); opacity:.3}}

/* curtain */
.curtain{position:fixed; inset:0; z-index:60; display:grid; place-items:center; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.panel-c{position:absolute; top:0; bottom:0; width:51%; background-color:#7FD3F7;
  background-image:radial-gradient(circle, var(--duck) 0 6px, var(--ink) 6.5px 8px, transparent 8.5px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 6px, rgba(255,255,255,0) 26px, rgba(22,50,79,.16) 48px, rgba(255,255,255,.28) 64px);
  background-size:56px 56px, 64px 100%; transition:transform .85s cubic-bezier(.65,.05,.3,1)}
.panel-c.l{left:0; border-right:3px solid rgba(22,50,79,.35)}
.panel-c.r{right:0; border-left:3px solid rgba(22,50,79,.35); background-position:28px 28px, 0 0}
.rod{position:absolute; z-index:2; top:env(safe-area-inset-top, 0px); left:0; right:0; height:14px; background:linear-gradient(#F4F8FB,#9FB1BF); border-bottom:2px solid var(--ink); transition:opacity .4s .4s}
.rod::after{content:""; position:absolute; left:0; right:0; top:4px; height:28px; background:radial-gradient(circle at 50% 50%, transparent 7px, #B9C7D2 8px 11px, var(--ink) 11.5px 12.5px, transparent 13px) 0 0/64px 28px repeat-x}
.curtain.open .panel-c.l{transform:translateX(-104%)}
.curtain.open .panel-c.r{transform:translateX(104%)}
.curtain.open .rod{opacity:0}
.curtain-card{position:relative; z-index:3; background:var(--enamel); border:4px solid var(--ink); border-radius:26px; padding:26px 30px; max-width:540px; width:100%; text-align:center; box-shadow:0 8px 0 var(--ink); display:grid; gap:12px; justify-items:center}
.eyebrow{font-weight:800; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.curtain-card h2{font-family:var(--display); font-weight:400; font-size:clamp(26px, 4vw, 40px); line-height:1.05}
.curtain-card .nm.p0{color:#D63A40} .curtain-card .nm.p1{color:var(--cobalt)}
.curtain-card p{margin:0; font-weight:600; color:var(--muted); font-size:17px}
.curtain-card small{font-weight:700; color:var(--muted)}

/* victory */
.victory{text-align:center; max-width:980px; margin:0 auto; width:100%}
.trophy{position:relative; width:220px}
.trophy svg{width:100%; height:auto; filter:sepia(1) saturate(4) hue-rotate(-8deg) brightness(1.05) drop-shadow(0 4px 0 var(--ink)); animation:bob 2.4s ease-in-out infinite}
.plinth{margin:-6px auto 0; width:80%; background:var(--ink); color:var(--duck); font-family:var(--display); font-size:15px; padding:6px 8px; border-radius:8px 8px 14px 14px}
.victory h1{font-family:var(--display); font-weight:400; font-size:clamp(36px, 6vw, 72px); line-height:1; color:var(--duck); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink)}
.victory .tag{font-size:20px; font-weight:700; margin:0}
.stats{padding:6px 10px; overflow-x:auto; max-width:100%}
.stats table{border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:17px}
.stats th,.stats td{padding:8px 14px; text-align:right}
.stats th:first-child{text-align:left}
.stats thead th{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stats tbody tr+tr{border-top:2px dashed rgba(22,50,79,.25)}

<script id="logic">
/* Pure game rules (tested headlessly). */
const N = 10;
const SHIPS = [
  {id:'banana',   name:'Banana Boat',      len:5},
  {id:'pizza',    name:'Pizza Raft',       len:4},
  {id:'tug',      name:'Toy Tugboat',      len:3},
  {id:'flamingo', name:'Flamingo Floatie', len:3},
  {id:'duck',     name:'Rubber Duck',      len:2},
];
const DEF = Object.fromEntries(SHIPS.map(s => [s.id, s]));
function newFleet(){ return SHIPS.map(s => ({id:s.id, len:s.len, r:-1, c:-1, dir:'h', placed:false, hits:0})); }
function newShots(){ return Array.from({length:N}, () => Array(N).fill(0)); }
function cellsOf(r, c, len, dir){ const out = []; for (let i = 0; i < len; i++) out.push(dir === 'h' ? [r, c + i] : [r + i, c]); return out; }
function canPlace(fleet, id, r, c, dir){
  const s = fleet.find(x => x.id === id); if (!s) return false;
  const cs = cellsOf(r, c, s.len, dir);
  if (cs.some(([y, x]) => y < 0 || x < 0 || y >= N || x >= N)) return false;
  const occ = new Set();
  fleet.forEach(o => { if (o.placed && o.id !== id) cellsOf(o.r, o.c, o.len, o.dir).forEach(([y, x]) => occ.add(y * N + x)); });
  return cs.every(([y, x]) => !occ.has(y * N + x));
}
function place(fleet, id, r, c, dir){
  if (!canPlace(fleet, id, r, c, dir)) return false;
  Object.assign(fleet.find(x => x.id === id), {r, c, dir, placed:true});
  return true;
}
function autoPlace(fleet, rng = Math.random){
  for (let attempt = 0; attempt < 50; attempt++){
    fleet.forEach(s => { s.placed = false; s.r = -1; s.c = -1; });
    let ok = true;
    for (const s of fleet){
      let done = false;
      for (let t = 0; t < 500 && !done; t++){
        const dir = rng() < .5 ? 'h' : 'v';
        done = place(fleet, s.id, Math.floor(rng() * N), Math.floor(rng() * N), dir);
      }
      if (!done){ ok = false; break; }
    }
    if (ok) return fleet;
  }
  throw new Error('could not place fleet');
}
function allPlaced(fleet){ return fleet.every(s => s.placed); }
function shipAt(fleet, r, c){ return fleet.find(s => s.placed && cellsOf(s.r, s.c, s.len, s.dir).some(([y, x]) => y === r && x === c)) || null; }
function isSunk(s){ return s.hits >= s.len; }
function fireAt(fleet, shots, r, c){
  if (r < 0 || c < 0 || r >= N || c >= N) return {result:'invalid'};
  if (shots[r][c]) return {result:'repeat'};
  const s = shipAt(fleet, r, c);
  if (!s){ shots[r][c] = 1; return {result:'miss'}; }
  shots[r][c] = 2; s.hits++;
  const sunk = isSunk(s);
  return {result: sunk ? 'sunk' : 'hit', ship:s.id, won: sunk && fleet.every(isSunk)};
}
if (typeof module !== 'undefined') module.exports = {N, SHIPS, newFleet, newShots, cellsOf, canPlace, place, autoPlace, allPlaced, shipAt, fireAt, isSunk};
</script>

/* ---------- sound (synthesized, no files) ---------- */
const A = {ctx:null, muted:false};

function ac(){
  if (A.muted) return null;
  try {
    if (!A.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; A.ctx = new C(); }
    if (A.ctx.state === 'suspended') A.ctx.resume();
    return A.ctx;
  } catch(e){ return null; }
}
function tone({type='sine', f0, f1, dur, vol=.2, delay=0}){
  const c = ac(); if (!c) return; const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise({dur, vol=.3, filter='lowpass', f0=1000, f1=200, q=1, delay=0}){
  const c = ac(); if (!c) return; const t = c.currentTime + delay;
  const len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(); s.buffer = b;
  const fl = c.createBiquadFilter(); fl.type = filter; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(c.destination); s.start(t); s.stop(t + dur);
}

function shipEl(s, extra = ''){
  return `<div class="ship ${s.dir === 'v' ? 'v' : ''} ${extra}" style="--len:${s.len};left:calc(var(--cell)*${s.c});top:calc(var(--cell)*${s.r});width:calc(var(--cell)*${s.dir === 'h' ? s.len : 1});height:calc(var(--cell)*${s.dir === 'h' ? 1 : s.len})">${shipSVG(s.id)}</div>`;
}

function boardHTML({fleet, shots, mode, small = false, id}){
  let h = `<div class="tub ${small ? 'small' : ''} mode-${mode}" id="${id}"><div class="board"><div></div>`;
  for (let c = 0; c < N; c++) h += `<div class="lab" style="grid-row:1;grid-column:${c + 2}">${c + 1}</div>`;
  for (let r = 0; r < N; r++) h += `<div class="lab" style="grid-column:1;grid-row:${r + 2}">${ROWS[r]}</div>`;
  h += `<div class="water"><div class="caustics"></div>`;
  fleet.filter(s => s.placed && (mode !== 'target' || isSunk(s))).forEach(s => { h += shipEl(s, isSunk(s) ? 'sunk' : ''); });
  if (mode === 'place') h += `<div class="ship ghost" id="ghost" hidden></div>`;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const v = shots ? shots[r][c] : 0;
    const tgt = mode === 'target' && !v && !S.fired;
    const aria = mode === 'target' ? ` role="button" aria-label="${ROWS[r]}${c + 1}${v === 1 ? ', miss' : v === 2 ? ', hit' : ''}"${tgt ? ' tabindex="0"' : ''}` : '';
    h += `<div class="cell${tgt ? ' tgt' : ''}" data-r="${r}" data-c="${c}"${aria}>${v === 1 ? '<i class="mk miss"></i>' : v === 2 ? '<i class="mk hit"></i>' : ''}</div>`;
  }
  return h + `</div></div></div>`;
}

            <span class="mini" style="--len:${s.len}">${shipSVG(s.id)}</span>
            <b>${DEF[s.id].name}<span class="pips">${'<i></i>'.repeat(s.len)}</span></b>
            <span class="st">${s.placed ? 'In the tub' : S.sel === s.id ? 'Click the water to drop it' : 'Not placed yet'}</span></button>`).join('')}</div>
        <div class="row">
          <button class="btn" id="rotate">Turn: ${S.dir === 'h' ? 'sideways' : 'up and down'}</button>
          <button class="btn" id="shuffle">Shuffle</button>
          <button class="btn" id="clear">Clear</button>
        </div>
        <button class="btn primary big" id="ready" ${left ? 'disabled' : ''}>${left ? `Place ${left} more ${left === 1 ? 'boat' : 'boats'}` : 'Ready. Close the curtain'}</button>
      </aside>
    </div></main>`;
}

function tracker(p, title, mine){
  return `<div class="tracker"><h3>${title}</h3><ul>${S.fleets[p].map(s => {
    const sunk = isSunk(s), hurt = mine && !sunk && s.hits > 0;
    return `<li class="${sunk ? 'sunk' : hurt ? 'hurt' : ''}"><span class="mini xs" style="--len:${s.len}">${shipSVG(s.id)}</span><span>${DEF[s.id].name}</span><em>${sunk ? 'Sunk' : hurt ? 'Leaking' : 'Afloat'}</em></li>`;
  }).join('')}</ul></div>`;
}

function turnScreen(){
  const me = S.cur, op = other(me), L = S.last;
  const quip = L ? `<div class="quip ${L.result}${freshQuip ? ' fresh' : ''}" role="status"><b>${esc(L.word)}</b><span>${esc(L.quip)}</span></div>`
                 : `<div class="quip idle" role="status"><b>Your shot</b><span>Tap or click any square in ${NAME(op)}'s tub.</span></div>`;
  const pass = S.fired && !S.winPending ? `<button class="btn primary big" id="pass">Pass the laptop to ${NAME(op)}</button>` : '';
  const st = S.stats[me];
  return `<main class="screen">
    <div class="heading"><h2>${NAME(me)}, fire away</h2>
      <p>${S.bonus ? 'A hit earns another shot.' : 'One shot per turn.'} Your shots: ${st.shots}. Hits: ${st.hits}.</p></div>
    <div class="arena">
      <div class="board-col"><div class="board-label">${NAME(op)}'s tub</div>
        ${boardHTML({fleet:S.fleets[op], shots:S.shots[op], mode:'target', id:'targetBoard'})}
        <div class="result">${quip}${pass}</div>
      </div>
      <aside class="panel side">
        <div class="board-label">Your tub</div>
        ${boardHTML({fleet:S.fleets[me], shots:S.shots[me], mode:'own', small:true, id:'ownBoard'})}
        ${tracker(op, `${NAME(op)}'s boats`, false)}
        ${tracker(me, 'Your boats', true)}
      </aside>
    </div></main>`;
}

function victoryScreen(){
  const w = S.winner, l = other(w);
  const row = p => { const st = S.stats[p], acc = st.shots ? Math.round(100 * st.hits / st.shots) : 0;
    return `<tr><th>${NAME(p)}</th><td>${st.shots}</td><td>${st.hits}</td><td>${acc}%</td><td>${S.wins[p]}</td></tr>`; };
  return `<main class="screen victory">
    <div class="trophy">${shipSVG('duck')}<div class="plinth">Admiral of the Tub</div></div>
    <h1>${NAME(w)} rules the tub!</h1>
    <p class="tag">${esc(S.winLine)}</p>
    <div class="card stats"><table><thead><tr><th>Captain</th><th>Shots</th><th>Hits</th><th>Aim</th><th>Wins</th></tr></thead><tbody>${row(w)}${row(l)}</tbody></table></div>
    <div class="row center">
      <button class="btn primary big" id="rematch">Rematch. ${NAME(l)} shoots first</button>
      <button class="btn big" id="newcap">New captains</button>
    </div>
    <div class="reveal">
      <div class="board-col"><div class="board-label">${NAME(w)}'s tub</div>${boardHTML({fleet:S.fleets[w], shots:S.shots[w], mode:'own', small:true, id:'revW'})}</div>
      <div class="board-col"><div class="board-label">${NAME(l)}'s tub</div>${boardHTML({fleet:S.fleets[l], shots:S.shots[l], mode:'own', small:true, id:'revL'})}</div>
    </div>
  </main>`;
}

/* ---------- render + wiring ---------- */
function render(){
  let body = '';
  if (S.phase === 'title') body = titleScreen();
  else if (S.phase === 'handoff') body = handoffScreen();
  else if (S.phase === 'place') body = placeScreen();
  else if (S.phase === 'turn') body = turnScreen();
  else if (S.phase === 'victory') body = victoryScreen();
  app.innerHTML = topbar() + body;
  bindCommon();
  if (S.phase === 'title') bindTitle();
  if (S.phase === 'handoff'){ const b = $('#openCurtain'); b.addEventListener('click', openCurtain); setTimeout(() => b.focus(), 50); }
  if (S.phase === 'place') bindPlace();
  if (S.phase === 'turn') bindTurn();
  if (S.phase === 'victory') bindVictory();
  freshQuip = false;
}

function bindCommon(){
  $('#mute').addEventListener('click', () => {
    A.muted = !A.muted; try { localStorage.setItem('ba-muted', A.muted ? '1' : '0'); } catch(e){}
    if (!A.muted) SFX.click(); render();
  });
  const q = $('#quit');
  if (q) q.addEventListener('click', () => {
    if (!quitArmed){ quitArmed = true; render(); clearTimeout(quitTimer); quitTimer = setTimeout(() => { quitArmed = false; if (document.getElementById('quit')) render(); }, 3000); return; }
    quitArmed = false; clearTimeout(quitTimer); busy = false; S.winPending = false; stopConfetti(); S.phase = 'title'; S.wins = [0,0]; render();
  });
}

function bindTitle(){
  $('#setup').addEventListener('submit', e => {
    e.preventDefault();
    const n1 = $('#p1').value.trim() || 'Captain Bubbles', n2 = $('#p2').value.trim() || 'Admiral Suds';
    S.names = [n1, n2.toLowerCase() === n1.toLowerCase() ? n2 + ' II' : n2];
    S.bonus = $('#bonus').checked; S.wins = [0,0]; S.starter = 0;
    SFX.click(); newRound();
  });
}

function newRound(){
  S.fleets = [newFleet(), newFleet()]; S.shots = [newShots(), newShots()];
  S.stats = [{shots:0,hits:0},{shots:0,hits:0}]; S.winner = null; S.winPending = false;
  S.cur = S.starter; S.after = 'place'; S.phase = 'handoff'; S.sel = 'banana'; S.dir = 'h'; S.fired = false; S.last = null;
  render();
}

function openCurtain(){
  SFX.swoosh(); S.phase = S.after; hover = null; render();
  const c = document.createElement('div');
  c.className = 'curtain'; c.setAttribute('aria-hidden', 'true');
  c.innerHTML = '<div class="rod"></div><div class="panel-c l"></div><div class="panel-c r"></div>';
  overlay.appendChild(c);
  requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('open')));
  setTimeout(() => c.remove(), 1000);
}

function rotate(){
  S.dir = S.dir === 'h' ? 'v' : 'h'; SFX.rotate();
  if (S.phase === 'place') render();
}

function bindPlace(){
  const f = S.fleets[S.cur];
  const water = $('#placeBoard .water'), ghost = $('#ghost');
  const fit = (r, c) => { const s = f.find(x => x.id === S.sel); if (!s) return null;
    return S.dir === 'h' ? {s, r, c:Math.min(c, N - s.len)} : {s, r:Math.min(r, N - s.len), c}; };
  const showGhost = () => {
    const s = f.find(x => x.id === S.sel);
    if (!hover || !s || s.placed){ ghost.hidden = true; return; }
    const p = fit(hover.r, hover.c), ok = canPlace(f, s.id, p.r, p.c, S.dir);
    ghost.hidden = false;
    ghost.className = `ship ghost ${S.dir === 'v' ? 'v' : ''} ${ok ? 'ok' : 'bad'}`;
    ghost.style.cssText = `--len:${s.len};left:calc(var(--cell)*${p.c});top:calc(var(--cell)*${p.r});width:calc(var(--cell)*${S.dir === 'h' ? s.len : 1});height:calc(var(--cell)*${S.dir === 'h' ? 1 : s.len})`;
    if (ghost.dataset.id !== s.id){ ghost.innerHTML = shipSVG(s.id); ghost.dataset.id = s.id; }
  };
  showGhost();
  water.addEventListener('mousemove', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    if (!hover || hover.r !== r || hover.c !== c){ hover = {r, c}; showGhost(); }
  });
  water.addEventListener('mouseleave', () => { hover = null; showGhost(); });
  water.addEventListener('contextmenu', e => { e.preventDefault(); rotate(); });
  water.addEventListener('click', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const there = shipAt(f, r, c);
    if (there){ there.placed = false; S.dir = there.dir; S.sel = there.id; hover = {r, c}; SFX.rotate(); render(); return; }
    const sel = f.find(x => x.id === S.sel);
    if (!sel || sel.placed){ SFX.bad(); return; }
    const p = fit(r, c);
    if (place(f, sel.id, p.r, p.c, S.dir)){
      SFX.place(); const nx = f.find(x => !x.placed); S.sel = nx ? nx.id : null; hover = {r, c}; render();
    } else { SFX.bad(); ghost.classList.remove('nope'); void ghost.offsetWidth; ghost.classList.add('nope'); }
  });
  app.querySelectorAll('.dock-item').forEach(b => b.addEventListener('click', () => {
    const s = f.find(x => x.id === b.dataset.ship);
    if (s.placed){ s.placed = false; S.dir = s.dir; }
    S.sel = s.id; SFX.click(); render();
  }));
  $('#rotate').addEventListener('click', rotate);
  $('#shuffle').addEventListener('click', () => { autoPlace(f); S.sel = null; SFX.place(); render(); });
  $('#clear').addEventListener('click', () => { f.forEach(s => { s.placed = false; }); S.sel = 'banana'; SFX.rotate(); render(); });
  $('#ready').addEventListener('click', () => {
    if (!allPlaced(f)) return;
    SFX.click();
    if (S.cur === S.starter){ S.cur = other(S.starter); S.after = 'place'; S.sel = 'banana'; S.dir = 'h'; }
    else { S.cur = S.starter; S.after = 'turn'; S.fired = false; S.last = null; }
    S.phase = 'handoff'; render();
  });
}

function spawnFx(water, r, c, kind, word){
  const d = document.createElement('div');
  d.className = 'fx ' + (kind === 'miss' ? 'fx-miss' : 'fx-hit');
  d.style.left = `calc(var(--cell)*${c + .5})`; d.style.top = `calc(var(--cell)*${r + .5})`;
  d.innerHTML = kind === 'miss'
    ? `<span class="ring"></span><span class="ring two"></span>${'<span class="drop"></span>'.repeat(7)}<b>${esc(word)}</b>`
    : `${BURST}<b>${kind === 'sunk' ? 'Glug glug!' : esc(word)}</b>`;
  d.querySelectorAll('.drop').forEach((el, i) => el.style.setProperty('--a', (i * 51 + Math.random() * 20) + 'deg'));
  water.appendChild(d);
  setTimeout(() => d.remove(), 1700);
}

function bindTurn(){
  const water = $('#targetBoard .water');
  const fire = cell => {
    if (S.fired || busy) return;
    const r = +cell.dataset.r, c = +cell.dataset.c, me = S.cur, op = other(me);
    const res = fireAt(S.fleets[op], S.shots[op], r, c);
    if (res.result === 'repeat' || res.result === 'invalid') return;
    S.stats[me].shots++;
    let word, quip;
    if (res.result === 'miss'){ word = pick(MISS_W); quip = pick(MISS_Q); }
    else { S.stats[me].hits++;
      if (res.result === 'sunk'){ word = `Sunk the ${DEF[res.ship].name}!`; quip = SUNK_Q[res.ship]; }
      else { word = pick(HIT_W); quip = pick(HIT_Q); } }
    S.last = {result:res.result, word, quip};
    S.fired = !(S.bonus && res.result !== 'miss');
    if (res.won){ S.winner = me; S.wins[me]++; S.winLine = pick(WIN_Q); S.fired = true; S.winPending = true; }
    freshQuip = true; render();
    spawnFx($('#targetBoard .water'), r, c, res.result, word);
    if (res.result === 'miss') SFX.splash();
    else {
      SFX.boom();
      const tub = $('#targetBoard'); tub.classList.add('shake');
      if (res.result === 'sunk'){ SFX.sunk(); if (res.ship === 'duck') SFX.squeak(); if (res.ship === 'flamingo') SFX.pfft(); }
    }
    if (res.won){ busy = true; setTimeout(() => { busy = false; if (!S.winPending) return; S.phase = 'victory'; S.winPending = false; render(); SFX.win(); confetti(); }, 2300); }
  };
  water.addEventListener('click', e => { const cell = e.target.closest('.cell.tgt'); if (cell) fire(cell); });
  water.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tgt')){ e.preventDefault(); fire(e.target); }
  });
  const pass = $('#pass');
  if (pass){
    pass.addEventListener('click', () => { SFX.click(); S.cur = other(S.cur); S.fired = false; S.last = null; S.after = 'turn'; S.phase = 'handoff'; render(); });
    setTimeout(() => pass.focus({preventScroll:true}), 60);
  }
}

function bindVictory(){
  $('#rematch').addEventListener('click', () => { SFX.click(); stopConfetti(); S.starter = other(S.winner); newRound(); });
  $('#newcap').addEventListener('click', () => { SFX.click(); stopConfetti(); S.phase = 'title'; S.wins = [0,0]; render(); });
}

document.addEventListener('keydown', e => {
  if (S.phase !== 'place' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); rotate(); }
});

/* ---------- confetti ---------- */
let confettiRAF = null;
function stopConfetti(){ cancelAnimationFrame(confettiRAF); const cv = $('#confetti'); cv.hidden = true; }
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'); cv.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FFC93C','#FF5A5F','#2E8FD8','#FF7AB6','#1F9D5F','#FFFFFF'];
  const parts = Array.from({length:170}, () => ({x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .6,
    vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 3.5, r:Math.random() * 6.3, vr:(Math.random() - .5) * .3,
    w:6 + Math.random() * 7, h:4 + Math.random() * 6, c:cols[Math.floor(Math.random() * cols.length)], bubble:Math.random() < .22}));
  const t0 = performance.now();
  const step = t => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.x += p.vx + Math.sin((t + p.y) / 400); p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.bubble){ ctx.beginPath(); ctx.arc(0, 0, p.w * .8, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.stroke(); }
      else { ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.strokeStyle = '#16324F'; ctx.lineWidth = 1; ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    });
    if (t - t0 < 5500) confettiRAF = requestAnimationFrame(step); else stopConfetti();
  };
  confettiRAF = requestAnimationFrame(step);
}

/* ---------- ambient bubbles ---------- */
(() => {
  const bg = $('#bg'); let h = '';
  for (let i = 0; i < 14; i++){
    const s = 10 + Math.random() * 34;
    h += `<span class="bubble" style="left:${Math.random() * 100}%;width:${s}px;height:${s}px;--sway:${(Math.random() - .5) * 80}px;animation-duration:${14 + Math.random() * 16}s;animation-delay:${-Math.random() * 30}s"></span>`;
  }
  bg.innerHTML = h;
})();

/* ---------- boot (keeps a game in progress across page updates) ---------- */
window.claude?.hot?.snapshot?.(() => JSON.parse(JSON.stringify(S)));
function start(data){
  if (data && data.phase && Array.isArray(data.fleets)){
    S = Object.assign(S, data);
    if (S.winPending){ S.winPending = false; S.phase = 'victory'; }
  }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
